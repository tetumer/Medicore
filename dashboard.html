<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Dashboard</h2>
  <nav>
    <a href="index.html">🏠 Log Sale</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="sales.html">🧾 Sales History</a>
  </nav>

  <div id="dashboard" style="margin-top:20px;"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      renderDashboard();
    });
  </script>
<div id="heatmap" style="overflow-x:auto"></div>
<script>
fetch('busy_matrix.json').then(r=>r.json()).then(data=>{
  const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const hours=Object.keys(data).sort((a,b)=>a-b);
  const vals=hours.flatMap(h=>days.map(d=>data[h][d]).filter(v=>v!=null));
  const max=Math.max(...vals);
  let html="<table border=1 style='border-collapse:collapse;font-size:12px'><tr><th>hr</th>"+days.map(d=>"<th>"+d.slice(0,2)+"</th>").join("")+"</tr>";
  for(const h of hours){
    html+="<tr><td>"+h+"</td>";
    for(const d of days){
      const v=data[h][d];
      if(v==null){html+="<td style='background:#333'></td>";continue;}
      const a=Math.sqrt(v/max);
      html+=`<td style="background:rgba(76,175,80,${a.toFixed(2)});color:${a>0.5?'#fff':'#000'}">${v.toFixed(1)}</td>`;
    }
    html+="</tr>";
  }
  document.getElementById('heatmap').innerHTML=html+"</table>";
});
</script>
<select id="mixDay"></select>
<select id="mixHour"></select>
<select id="mixMonth"></select>
<button id="mixBtn">Predict</button>
<div id="mixResult"></div>
<script>
const CLASSNAMES={M01AB:'Diclofenac-type',M01AE:'Ibuprofen-type',N02BA:'Aspirin-type',N02BE:'Paracetamol (Napa!)',N05B:'Anxiety meds',N05C:'Sleep meds',R03:'Asthma inhalers',R06:'Antihistamines'};
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
mixDay.innerHTML=days.map(d=>`<option>${d}</option>`).join('');
mixHour.innerHTML=[...Array(24).keys()].map(h=>`<option>${h}</option>`).join('');
mixMonth.innerHTML=[...Array(12).keys()].map(m=>`<option value="${m+1}">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]}</option>`).join('');
let mix, sfac;
fetch('mix_matrix.json').then(r=>r.json()).then(d=>mix=d);
fetch('seasonal_factor.json').then(r=>r.json()).then(d=>sfac=d);
mixBtn.onclick=()=>{
  const cell=mix[mixDay.value]?.[mixHour.value];
  if(!cell){mixResult.innerHTML='no data (closed?)';return;}
  const top=Object.entries(cell).filter(([c])=>c!=='n')
    .map(([c,v])=>[c, v*(sfac[c]?.[mixMonth.value]??1)])
    .sort((a,b)=>b[1]-a[1]).slice(0,3);
  const conf=cell.n<30?'<b style="color:#c00">low confidence</b>':'';
  mixResult.innerHTML=top.map(([c,v])=>`${CLASSNAMES[c]}: ${v.toFixed(2)}`).join('<br>')
    +`<br><small>based on ${cell.n} past ${mixDay.value}s ${conf}</small>`;
};
</script>
<h3>Trained model (regression)</h3>
<input type="date" id="regDate" value="2019-04-24">
<select id="regHour"></select>
<button id="regBtn">Predict total</button>
<div id="regResult"></div>
<script>
let reg;
fetch('regression_model.json').then(r=>r.json()).then(d=>reg=d);
regHour.innerHTML=[...Array(24).keys()].map(h=>`<option>${h}</option>`).join('');
const fmt=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
regBtn.onclick=()=>{
  if(!regDate.value){regResult.textContent='pick a date first';return;}
  const d=new Date(regDate.value+'T00:00:00');
  const h=+regHour.value;
  const hol=new Set(reg.holidays);
  const back=n=>{const t=new Date(d);t.setDate(d.getDate()-n);return fmt(t);};
  const f={};
  for(let i=0;i<24;i++) f['h_'+i]=0;
  for(let i=0;i<7;i++)  f['d_'+i]=0;
  f['h_'+h]=1;
  f['d_'+((d.getDay()+6)%7)]=1;
  f.is_winter=[12,1,2].includes(d.getMonth()+1)?1:0;
  f.holiday_2days_ago=hol.has(back(2))?1:0;
  let s=reg.base;
  for(const k in f) s+=f[k]*reg.weights[k];
  regResult.textContent='expected total units/hour: '+Math.max(0,s).toFixed(2);
};
</script>
</body>
</html>
