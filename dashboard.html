<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Dashboard</h2>
  <nav>
    <a href="index.html">🏠 Log Sale</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="sales.html">🧾 Sales History</a>
  </nav>

  <div id="dashboard" style="margin-top:20px;"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      renderDashboard();
    });
  </script>
<div id="heatmap" style="overflow-x:auto"></div>
<script>
fetch('busy_matrix.json').then(r=>r.json()).then(data=>{
  const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const hours=Object.keys(data).sort((a,b)=>a-b);
  const vals=hours.flatMap(h=>days.map(d=>data[h][d]).filter(v=>v!=null));
  const max=Math.max(...vals);
  let html="<table border=1 style='border-collapse:collapse;font-size:12px'><tr><th>hr</th>"+days.map(d=>"<th>"+d.slice(0,2)+"</th>").join("")+"</tr>";
  for(const h of hours){
    html+="<tr><td>"+h+"</td>";
    for(const d of days){
      const v=data[h][d];
      if(v==null){html+="<td style='background:#333'></td>";continue;}
      const a=v/max;
      html+=`<td style="background:rgba(76,175,80,${a.toFixed(2)});color:${a>0.5?'#fff':'#000'}">${v.toFixed(1)}</td>`;
    }
    html+="</tr>";
  }
  document.getElementById('heatmap').innerHTML=html+"</table>";
});
</script>
</body>
</html>
